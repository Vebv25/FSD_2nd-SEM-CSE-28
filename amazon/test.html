<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Embed Example</title>
</head>
<body>
  
  <!-- Local Video -->
  <h2 style="color:brown" >Local Video (Controls , Autoplay disabled)</h2>
  <video src="video.mp4" controls autoplay="false" >
  </video>
  
  <!-- Music -->
  <h2 style="color:blue"> Audio (Autoplay & Loop)</h2>
  <audio src="https://bajaao.pendujatt.com.se/load/320/43054104/738198/Piyu%20Piyu%20Bole.mp3" autoplay loop>
    </audio>
  
  <!-- Embedded YouTube Video -->
  <h2 style="color:pink" >YouTube Video Embed</h2>
  <iframe 
  width="560" height="315" 
  src="https://www.youtube.com/embed/iKJLNver9xU?si=utVNg3eejaREhsD5" 
  title="YouTube video player" 
  frameborder="0" 
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
  referrerpolicy="strict-origin-when-cross-origin" 
  allowfullscreen>
</iframe>
  
</body>
</html>
