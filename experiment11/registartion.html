<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>

<div class="container">

    <h1>Student Registration Form</h1>
    <p class="subtitle">Please fill in all the required information carefully.</p>

    <form>

        <fieldset>
            <legend>Student Information</legend>

            <div class="row">
                <div class="input-box">
                    <label>Admission Number</label>
                    <input type="text" placeholder="Enter Admission Number" required>
                </div>

                <div class="input-box">
                    <label>Roll Number</label>
                    <input type="text" placeholder="Enter Roll Number">
                </div>
            </div>

            <div class="row">
                <div class="input-box">
                    <label>First Name</label>
                    <input type="text" required>
                </div>

                <div class="input-box">
                    <label>Last Name</label>
                    <input type="text" required>
                </div>
            </div>

            <div class="row">
                <div class="input-box">
                    <label>Email Address</label>
                    <input type="email" required>
                </div>

                <div class="input-box">
                    <label>Phone Number</label>
                    <input type="tel" required>
                </div>
            </div>

            <div class="row">
                <div class="input-box">
                    <label>Date of Birth</label>
                    <input type="date" required>
                </div>

                <div class="input-box">
                    <label>Age</label>
                    <input type="number">
                </div>
            </div>

            <div class="input-box">
                <label>Gender</label>

                <div class="gender">
                    <label><input type="radio" name="gender"> Male</label>
                    <label><input type="radio" name="gender"> Female</label>
                    <label><input type="radio" name="gender"> Other</label>
                </div>
            </div>

        </fieldset>

        <fieldset>
            <legend>Academic Details</legend>

            <div class="row">

                <div class="input-box">
                    <label>Course</label>

                    <select>
                        <option>Select Course</option>
                        <option>B.Tech CSE</option>
                        <option>B.Tech IT</option>
                        <option>BCA</option>
                        <option>BBA</option>
                        <option>MCA</option>
                    </select>
                </div>

                <div class="input-box">
                    <label>Year</label>

                    <select>
                        <option>1st Year</option>
                        <option>2nd Year</option>
                        <option>3rd Year</option>
                        <option>4th Year</option>
                    </select>
                </div>

            </div>

            <div class="input-box">

                <label>Preferred Subject</label>

                <select required>

                    <option>Select Preferred Subject</option>
                    <option>Python Programming</option>
                    <option>Cloud Computing</option>
                    <option>Java Programming</option>
                    <option>Web Development</option>
                    <option>Artificial Intelligence</option>
                    <option>Machine Learning</option>
                    <option>Data Structures</option>
                    <option>Database Management</option>

                </select>

            </div>

            <label>Languages Known</label>

            <div class="checkbox">

                <label><input type="checkbox"> English</label>
                <label><input type="checkbox"> Hindi</label>
                <label><input type="checkbox"> French</label>
                <label><input type="checkbox"> German</label>

            </div>

        </fieldset>

        <fieldset>

            <legend>Address Details</legend>

            <label>Permanent Address</label>

            <textarea rows="4"></textarea>

            <div class="row">

                <div class="input-box">
                    <label>City</label>
                    <input type="text">
                </div>

                <div class="input-box">
                    <label>State</label>
                    <input type="text">
                </div>

            </div>

            <div class="row">

                <div class="input-box">
                    <label>Country</label>
                    <input type="text">
                </div>

                <div class="input-box">
                    <label>Postal Code</label>
                    <input type="text">
                </div>

            </div>

        </fieldset>

        <fieldset>

            <legend>Parent Details</legend>

            <div class="row">

                <div class="input-box">
                    <label>Father's Name</label>
                    <input type="text">
                </div>

                <div class="input-box">
                    <label>Mother Name</label>
                    <input type="text">
                </div>

            </div>

            <div class="row">

                <div class="input-box">
                    <label>Parent Contact Number</label>
                    <input type="tel">
                </div>

                <div class="input-box">
                    <label>Occupation</label>
                    <input type="text">
                </div>

            </div>

        </fieldset>

        <fieldset>

            <legend>Account Details</legend>

            <div class="row">

                <div class="input-box">
                    <label>Create Password</label>
                    <input type="password">
                </div>

                <div class="input-box">
                    <label>Confirm Password</label>
                    <input type="password">
                </div>

            </div>

        </fieldset>

        <div class="agree">
            <label>
                <input type="checkbox" required>
                I hereby declare that all the information provided above is true.
            </label>
        </div>

        <div class="buttons">
            <button type="reset" class="reset">Reset</button>
            <button type="submit" class="submit">Register</button>
        </div>

    </form>

</div>
<script src="registration.js"></script>

</body>
</html>
